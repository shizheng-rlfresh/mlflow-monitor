name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --group doc

      - name: Run tests
        run: uv run --no-sync poe test

      - name: Run Ruff linting
        run: uv run --no-sync poe lint

      - name: Check Ruff format checking
        run: uv run --no-sync poe format-check

      - name: Run Pyright type checking
        run: uv run --no-sync poe typecheck

      - name: Validate Sphinx documentation
        run: uv run --no-sync poe docs

      - name: Build package
        run: uv run --no-sync poe build
